# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
# interface-name: en0
# global-client-fingerprint: random
etag-support: true
keep-alive-idle: 600
keep-alive-interval: 15
#disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

ntp:
  enable: true
  # 是否同步至系统时间，需要 root/管理员权限
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

# 嗅探
sniffer:
  enable: true
#  force-dns-mapping: true
#  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
#    - "rule-set:private_domain,direct_domain"
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "upg_id_file.bin"
    - "config.ptmi.gitv.tv"
    - "angela"
    - 'dlg.io.mi.com'

# 入站  
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address:
    - 111.206.174.2/32
    - 111.206.174.3/32
    - 192.172.233.145/32
#  mtu: 9000
#  strict-route: true
#  gso: true
#  gso-max-size: 65536
#  udp-timeout: 300

# DNS模块
dns:
  enable: true
  listen: :1053
  ipv6: true
  cache-algorithm: arc
  prefer-h3: true
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - "rule-set:private_domain,cn_domain,apple_domain"
    - "+.services.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "time.*.com"
    - '+.pool.ntp.org'
    - "geosite:cn,connectivity-check"
    - "+.stun.*.*"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - '+.windows.com'
    - '+.windowsupdate.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.nist.gov'
    - '+.mi.com'
    - '+.xiaomi.com'
    - '+.xiaomi.cn'
    - '+.xiaomi.net'
    - '+.xiaomiyoupin.com'
    - '+.mijia.tech'
    - '+.miot-spec.org'
    - '+.mi-img.com'
    - '+.miui.com'
