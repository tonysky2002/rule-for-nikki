# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr: &pr {type: select, proxies: [🚀 默认代理, 🔯 香港故转, 🔯 日本故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 台湾自动, ♻️ 自动选择, 🇭🇰 香港节点, TW 台湾节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点,自建节点,DIRECT]}
proxy-groups:
  - name: "自建节点"
    type: select
    proxies:
    - hostdz
    - hostdz-anytls
    - hostdz-cf
    - hk-yecao
    - hk-yecao-anytls
    - hk-wawo
    - hk-wawo-anytls
    - hk-wawo-cf
    - jp-legend
    - jp-legend-anytls
    - hncloud
    - hncloud-anytls
    include-all: true
    filter: "(?i)移动"
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
  - {name: 🚀 默认代理, type: select, proxies: [🔯 香港故转, 🔯 日本故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 台湾自动, ♻️ 自动选择, 🇭🇰 香港节点, TW 台湾节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点,自建节点,DIRECT]}
  - {name: 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 🤖 ChatGPT, <<: *pr}
  - {name: 🐟 漏网之鱼, <<: *pr}
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|hk|hongkong|hong kong|自建节点"}
  - {name: TW 台湾节点, type: select, include-all: true, filter: "(?i)台湾|tw|taiwan|tai wan|dz|legend"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日|jp|japan|自建节点"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)美|us|unitedstates|united states|自建节点"}
  - {name: 🔯 香港故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: ♻️ 香港自动, type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', tolerance: 20, interval: 300, filter: "(?=.*(台|tw|taiwan|tai wan))^((?!(港|美|日|韩|新)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, url: 'https://www.gstatic.com/generate_204', tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}

